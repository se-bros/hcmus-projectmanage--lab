<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Bản mẫu luồng cốt lõi HCMUS-LDMS</title><desc id="desc">Sáu màn hình phác thảo cho tải lên, OCR, hiệu chỉnh, xuất bản, tìm kiếm và đọc.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#17365d"/></marker><style>text{font-family:Arial,sans-serif;fill:#10233f}.h{font-size:24px;font-weight:700}.t{font-size:15px}.b{fill:#f7f9fc;stroke:#17365d;stroke-width:2;rx:12}.bar{fill:#17365d}.line{stroke:#9db0c8;stroke-width:2}.e{stroke:#17365d;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <text x="600" y="36" text-anchor="middle" class="h">BẢN MẪU LUỒNG SỐ HÓA VÀ ĐỌC TÀI LIỆU</text>
  <g class="t">
    <g transform="translate(40 80)"><rect class="b" width="310" height="210"/><rect class="bar" width="310" height="35"/><text x="155" y="24" fill="white" text-anchor="middle">1. TẢI TÀI LIỆU</text><text x="20" y="72">Chọn PDF/ảnh</text><rect x="20" y="88" width="270" height="45" fill="white" stroke="#9db0c8"/><text x="35" y="116">ten-tai-lieu.pdf</text><rect x="95" y="155" width="120" height="35" fill="#17365d" rx="5"/><text x="155" y="178" fill="white" text-anchor="middle">Tải lên</text></g>
    <g transform="translate(445 80)"><rect class="b" width="310" height="210"/><rect class="bar" width="310" height="35"/><text x="155" y="24" fill="white" text-anchor="middle">2. TRẠNG THÁI OCR</text><text x="20" y="75">Tài liệu: TL-001</text><text x="20" y="110">Trạng thái: Đang xử lý</text><rect x="20" y="132" width="270" height="18" fill="#d9e2ef" rx="9"/><rect x="20" y="132" width="165" height="18" fill="#4b78a8" rx="9"/><text x="20" y="185">Có thể rời trang và quay lại sau.</text></g>
    <g transform="translate(850 80)"><rect class="b" width="310" height="210"/><rect class="bar" width="310" height="35"/><text x="155" y="24" fill="white" text-anchor="middle">3. HIỆU CHỈNH</text><rect x="15" y="55" width="130" height="120" fill="white" stroke="#9db0c8"/><text x="80" y="112" text-anchor="middle">Bản gốc</text><rect x="165" y="55" width="130" height="120" fill="white" stroke="#9db0c8"/><text x="230" y="112" text-anchor="middle">Văn bản OCR</text><text x="155" y="195" text-anchor="middle">Lưu thay đổi · Trang 1/5</text></g>
    <g transform="translate(40 420)"><rect class="b" width="310" height="210"/><rect class="bar" width="310" height="35"/><text x="155" y="24" fill="white" text-anchor="middle">4. KIỂM TRA XUẤT BẢN</text><text x="20" y="75">✓ Nội dung đã hiệu chỉnh</text><text x="20" y="108">✓ Thông tin mô tả bắt buộc</text><text x="20" y="141">✓ Quyền xuất bản</text><rect x="95" y="160" width="120" height="35" fill="#287a45" rx="5"/><text x="155" y="183" fill="white" text-anchor="middle">Xuất bản</text></g>
    <g transform="translate(445 420)"><rect class="b" width="310" height="210"/><rect class="bar" width="310" height="35"/><text x="155" y="24" fill="white" text-anchor="middle">5. TÌM KIẾM</text><rect x="20" y="58" width="270" height="38" fill="white" stroke="#9db0c8"/><text x="35" y="83">Nhập từ khóa...</text><line class="line" x1="20" y1="125" x2="290" y2="125"/><text x="20" y="150">Giáo trình A · Tác giả · Năm</text><text x="20" y="180">Chỉ hiện tài liệu được phép xem</text></g>
    <g transform="translate(850 420)"><rect class="b" width="310" height="210"/><rect class="bar" width="310" height="35"/><text x="155" y="24" fill="white" text-anchor="middle">6. ĐỌC TRỰC TUYẾN</text><text x="20" y="72">Giáo trình A</text><rect x="20" y="88" width="270" height="82" fill="white" stroke="#9db0c8"/><text x="155" y="130" text-anchor="middle">Nội dung EPUB</text><text x="155" y="195" text-anchor="middle">← Chương trước · Chương sau →</text></g>
  </g>
  <path class="e" d="M350 185 H445"/><path class="e" d="M755 185 H850"/><path class="e" d="M1005 290 V355 H195 V420"/><path class="e" d="M350 525 H445"/><path class="e" d="M755 525 H850"/>
