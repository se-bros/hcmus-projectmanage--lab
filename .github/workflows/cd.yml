name: CD

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment Environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

jobs:
  build-verify:
    name: Build & Verify Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend bundle
        working-directory: src/frontend
        run: |
          npm ci
          npm run build

  infra-verify:
    name: Verify Infrastructure (IaaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validate Infrastructure Blueprint
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  deploy:
    name: Deploy Application
    needs: [build-verify, infra-verify]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || (github.ref == 'refs/heads/main' && 'production' || 'staging')) }}
      url: https://hcmus-projectmanage-lab.vercel.app
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Target Environment
        run: |
          ENV="${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || (github.ref == 'refs/heads/main' && 'production' || 'staging')) }}"
          echo "Deploying to environment: $ENV"
          echo "Target deployment URL: https://hcmus-projectmanage-lab.vercel.app"

  notify:
    name: Send CD Email Notification
    needs: [build-verify, infra-verify, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync
      - name: Send deployment notification email
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          DEPLOY_URL: "https://hcmus-projectmanage-lab.vercel.app"
          DEPLOY_ENV: ${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || (github.ref == 'refs/heads/main' && 'production' || 'staging')) }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          JOB_STATUSES: '{"build-verify":"${{ needs.build-verify.result }}","infra-verify":"${{ needs.infra-verify.result }}","deploy":"${{ needs.deploy.result }}"}'
        run: uv run python -m app.scripts.send_deploy_notification
