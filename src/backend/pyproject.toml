[project]
name = "backend"
version = "0.1.0"
description = "HCMUS-LDMS FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "authlib>=1.3.2",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "pdf2image>=1.17.0",
    "pillow>=12.1.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.10.1",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
