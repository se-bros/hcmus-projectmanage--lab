services:
  db:
    image: postgres:15-alpine
    container_name: libdms-db
    environment:
      - POSTGRES_DB=libdms
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d libdms"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: libdms-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app        # Hot-reload: thay đổi code không cần rebuild
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/libdms
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/\")'"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: libdms-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app       # Hot-reload
      - /app/node_modules     # Giữ node_modules trong container
      - /app/.next            # Giữ .next trong container, tránh xung đột cache với máy host
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
